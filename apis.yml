name: Storefront
description: >-
  Storefront (thestorefront.com) is an online marketplace for renting short-term
  commercial retail space, connecting brands, e-commerce businesses, and artists
  with space owners to launch pop-up shops, showrooms, galleries, product launches,
  and events. The platform lists tens of thousands of spaces across 50+ cities in
  North America, Europe, and Asia, with flexible day/week/month rentals and a secure
  booking-and-payment flow, 24-hour support, and a Priority Pass membership. Storefront
  was surfaced as a portfolio company of 500 Global and Point Nine and added to the
  API Evangelist network. As of this enrichment pass the company exposes no public
  developer API, SDKs, or developer portal (api.thestorefront.com is private/401), so
  this profile captures company identity and public web properties only.
